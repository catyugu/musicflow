[project]
name = "musicflow"
version = "0.1.0"
description = "CLI toolchain that turns a PDF score, a real recording and a symbolic score into a score-sync MP4"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
    "partitura>=1.9",
    "pymupdf>=1.26,<2",
    "pillow>=11",
    "opencv-python-headless>=4.10",
    "verovio>=6.4",
    "resvg-py>=0.5",
    "librosa>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[project.scripts]
musicflow = "musicflow.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/musicflow"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-q -m "not slow" --strict-markers'
markers = [
    "slow: corpus-scale or costly check; run with `pytest -m slow`, not in the edit loop",
]
